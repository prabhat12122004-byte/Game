<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>Hill Warriors</title>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

*{
  box-sizing:border-box;

  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;

  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:#111;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  touch-action:none;

  font-family:Arial,sans-serif;
}


/* Prevent Android long-press menus */

button,
div,
canvas,
span,
h1,
h2,
p{

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;

}


/* =========================================================
   SCREENS
========================================================= */

.screen{

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

}


/* =========================================================
   MAIN MENU
========================================================= */

#menu{

  background:
    linear-gradient(
      #172b18,
      #315d2c
    );

  color:white;

  text-align:center;

  padding:25px;

}


.logo{

  font-size:
    clamp(
      40px,
      8vw,
      80px
    );

  font-weight:900;

  color:#ffd83d;

  text-shadow:
    4px 4px #000;

}


.developer{

  margin-top:5px;

  font-size:18px;

}


.menuBox{

  width:
    min(
      430px,
      90vw
    );

  margin-top:30px;

}


input{

  width:100%;

  padding:15px;

  border:0;

  border-radius:10px;

  font-size:18px;

  text-align:center;

  margin-bottom:12px;

  user-select:text;
  -webkit-user-select:text;

}


button{

  border:0;

  border-radius:12px;

  padding:15px 22px;

  margin:7px;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

}


button:active{

  transform:scale(.96);

}


.primary{

  background:#ffd83d;

  color:#222;

}


.secondary{

  background:#eee;

  color:#222;

}


.hidden{

  display:none!important;

}


/* =========================================================
   GAME SCREEN
========================================================= */

#game{

  position:relative;

  width:100%;
  height:100%;

  background:#80cfff;

  overflow:hidden;

  touch-action:none;

}


canvas{

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

}


/* =========================================================
   HUD
========================================================= */

#hud{

  position:absolute;

  left:15px;
  top:12px;

  color:white;

  font-size:18px;

  font-weight:bold;

  text-shadow:
    2px 2px #000;

  z-index:50;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;

}


#pauseBtn{

  position:absolute;

  right:
    max(
      15px,
      env(safe-area-inset-right)
    );

  top:
    max(
      12px,
      env(safe-area-inset-top)
    );

  z-index:100;

  padding:10px 18px;

  background:white;

  touch-action:manipulation;

}


/* =========================================================
   MOBILE DRIVING CONTROLS
========================================================= */

.control{

  position:absolute;

  bottom:
    max(
      18px,
      env(safe-area-inset-bottom)
    );

  width:130px;
  height:80px;

  border-radius:50%;

  z-index:200;

  font-size:20px;

  font-weight:900;

  opacity:.94;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  white-space:nowrap;

  margin:0;

  padding:0;

  cursor:pointer;

  pointer-events:auto;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  -webkit-tap-highlight-color:transparent;

  -webkit-user-drag:none;

  outline:none;

  box-shadow:
    0 5px 12px rgba(0,0,0,.45);

}


/* Brake */

#brake{

  left:
    max(
      20px,
      env(safe-area-inset-left)
    );

  background:#e9e9e9;

  color:#111;

}


/* Accelerate */

#accelerate{

  right:
    max(
      20px,
      env(safe-area-inset-right)
    );

  background:#ffd83d;

  color:#111;

}


/* Button press visual */

.control:active{

  transform:scale(.93);

}


/* =========================================================
   PAUSE SCREEN
========================================================= */

#pauseScreen{

  position:absolute;

  inset:0;

  background:
    rgba(
      0,
      0,
      0,
      .68
    );

  z-index:300;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  color:white;

}


#pauseScreen h1{

  font-size:50px;

}


/* =========================================================
   COUNTDOWN
========================================================= */

#countdown{

  position:absolute;

  inset:0;

  z-index:250;

  display:flex;

  justify-content:center;

  align-items:center;

  color:white;

  font-size:100px;

  font-weight:900;

  text-shadow:
    5px 5px #000;

  pointer-events:none;

}


/* =========================================================
   MULTIPLAYER LOBBY
========================================================= */

#lobby{

  background:#172b18;

  color:white;

  text-align:center;

  padding:20px;

}


#players{

  margin:20px auto;

  width:
    min(
      450px,
      90vw
    );

  text-align:left;

}


.player{

  background:#333;

  margin:5px;

  padding:10px;

  border-radius:8px;

}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-height:500px){

  .control{

    width:105px;
    height:65px;

    font-size:16px;

    bottom:12px;

  }

  #hud{

    font-size:14px;

    top:8px;

    left:8px;

  }

  #pauseBtn{

    top:8px;

    right:8px;

    padding:8px 14px;

  }

}


/* =========================================================
   VERY SMALL WIDTH
========================================================= */

@media(max-width:700px){

  .control{

    width:115px;
    height:70px;

  }

}

</style>

</head>


<body>


<!-- ========================================================
     MAIN MENU
========================================================= -->

<div id="menu" class="screen">

  <div class="menuBox">

    <div class="logo">
      HILL WARRIORS
    </div>

    <div class="developer">
      Developed by Prabhat Kumar Singh
    </div>

    <br>

    <input
      id="playerName"
      placeholder="Enter your name"
      maxlength="18"
      autocomplete="off">

    <button
      class="primary"
      id="startBtn">

      START GAME

    </button>

  </div>

</div>



<!-- ========================================================
     MODE SELECTION
========================================================= -->

<div
  id="mode"
  class="screen hidden"
  style="
    background:#172b18;
    color:white;
    text-align:center;
  ">

  <div>

    <h1>
      HILL WARRIORS
    </h1>

    <h2>
      Choose Game Mode
    </h2>

    <button
      class="primary"
      id="singleBtn">

      SINGLE PLAYER

    </button>

    <button
      class="secondary"
      id="multiBtn">

      MULTIPLAYER

    </button>

    <br>

    <button
      class="secondary"
      id="backBtn">

      BACK

    </button>

  </div>

</div>



<!-- ========================================================
     MAP SELECTION
========================================================= -->

<div
  id="mapMenu"
  class="screen hidden"
  style="
    background:#172b18;
    color:white;
    text-align:center;
  ">

  <div>

    <h1>
      SELECT MAP
    </h1>

    <button
      class="primary mapBtn"
      data-map="jungle">

      🌴 JUNGLE

    </button>

    <button
      class="primary mapBtn"
      data-map="sand">

      🏜️ SAND

    </button>

    <button
      class="primary mapBtn"
      data-map="space">

      🚀 SPACE

    </button>

    <br>

    <button
      class="secondary"
      id="mapBack">

      BACK

    </button>

  </div>

</div>



<!-- ========================================================
     MULTIPLAYER LOBBY
========================================================= -->

<div
  id="lobby"
  class="screen hidden">

  <div>

    <h1>
      MULTIPLAYER
    </h1>

    <p>
      Maximum 4 players
    </p>

    <input
      id="roomCode"
      placeholder="Enter room code"
      autocomplete="off">

    <br>

    <button
      class="primary"
      id="joinBtn">

      JOIN ROOM

    </button>

    <button
      class="secondary"
      id="createBtn">

      CREATE ROOM

    </button>

    <h2 id="roomTitle"></h2>

    <div id="players"></div>

    <button
      class="primary hidden"
      id="readyBtn">

      READY

    </button>

    <button
      class="secondary"
      id="lobbyBack">

      MAIN MENU

    </button>

  </div>

</div>



<!-- ========================================================
     GAME
========================================================= -->

<div id="game" class="hidden">

  <canvas id="canvas"></canvas>


  <div id="hud">

    Distance:
    <span id="distance">
      0
    </span>
    m

    <br>

    Position:
    <span id="position">
      1
    </span>/4

    <br>

    Fuel:
    <span id="fuel">
      100
    </span>%

  </div>


  <button
    id="pauseBtn">

    PAUSE

  </button>


  <!-- BRAKE -->

  <button
    class="control"
    id="brake"
    type="button"
    aria-label="Brake">

    BRAKE

  </button>


  <!-- ACCELERATE -->

  <button
    class="control"
    id="accelerate"
    type="button"
    aria-label="Accelerate">

    ACCELERATE

  </button>


  <!-- PAUSE MENU -->

  <div
    id="pauseScreen"
    class="hidden">

    <h1>
      PAUSED
    </h1>

    <button
      class="primary"
      id="resumeBtn">

      RESUME

    </button>

    <button
      class="secondary"
      id="menuBtn">

      MAIN MENU

    </button>

  </div>


  <div id="countdown"></div>

</div>



<script>

/* =========================================================
   HILL WARRIORS
   Touch-fixed version
========================================================= */

"use strict";


/* =========================================================
   BASIC VARIABLES
========================================================= */

const $ =
  id =>
    document.getElementById(id);


let playerName =
  localStorage.getItem(
    "hillWarriorsName"
  ) || "";


let selectedMap =
  "jungle";


let gameMode =
  "single";


let running =
  false;


let paused =
  false;


let animationID;


/* =========================================================
   DISABLE LONG-PRESS / TEXT CONTEXT MENU
========================================================= */

document.addEventListener(
  "contextmenu",
  function(e){

    /*
      Prevent Android's
      Copy / Share / Read aloud
      menu during gameplay.
    */

    if(
      e.target.closest &&
      e.target.closest(".control")
    ){

      e.preventDefault();

      return false;

    }

  },
  {
    passive:false
  }
);


/* =========================================================
   SCREEN MANAGEMENT
========================================================= */

function show(id){

  [
    "menu",
    "mode",
    "mapMenu",
    "lobby",
    "game"
  ]
  .forEach(
    x =>
      $(x).classList.add(
        "hidden"
      )
  );


  $(id)
    .classList.remove(
      "hidden"
    );

}


/* =========================================================
   MAIN MENU
========================================================= */

$("playerName").value =
  playerName;


$("startBtn").addEventListener(
  "click",
  function(){

    const name =
      $("playerName")
      .value
      .trim();


    if(!name){

      $("playerName").focus();

      return;

    }


    playerName =
      name;


    localStorage.setItem(
      "hillWarriorsName",
      playerName
    );


    show("mode");

  }
);


/* =========================================================
   GAME MODE
========================================================= */

$("singleBtn").addEventListener(
  "click",
  function(){

    gameMode =
      "single";

    show("mapMenu");

  }
);


$("multiBtn").addEventListener(
  "click",
  function(){

    gameMode =
      "multi";

    show("lobby");

  }
);


$("backBtn").addEventListener(
  "click",
  function(){

    show("menu");

  }
);


/* =========================================================
   MAP SELECTION
========================================================= */

document
  .querySelectorAll(".mapBtn")
  .forEach(
    btn => {

      btn.addEventListener(
        "click",
        function(){

          selectedMap =
            btn.dataset.map;


          if(
            gameMode ===
            "single"
          ){

            startSinglePlayer();

          }

        }
      );

    }
  );


$("mapBack").addEventListener(
  "click",
  function(){

    show("mode");

  }
);


/* =========================================================
   CANVAS
========================================================= */

const canvas =
  $("canvas");


const ctx =
  canvas.getContext(
    "2d"
  );


let W;
let H;


function resize(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  W =
    window.innerWidth;


  H =
    window.innerHeight;


  canvas.width =
    W * dpr;


  canvas.height =
    H * dpr;


  canvas.style.width =
    W + "px";


  canvas.style.height =
    H + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


window.addEventListener(
  "resize",
  resize
);


resize();


/* =========================================================
   TERRAIN
========================================================= */

let terrain =
  [];


function makeTerrain(){

  terrain = [];


  for(
    let x=0;
    x<10000;
    x+=20
  ){

    let y;


    if(
      selectedMap ===
      "jungle"
    ){

      y =
        H * .70
        +
        Math.sin(
          x * .008
        ) * 55
        +
        Math.sin(
          x * .021
        ) * 25;

    }

    else if(
      selectedMap ===
      "sand"
    ){

      y =
        H * .72
        +
        Math.sin(
          x * .006
        ) * 65
        +
        Math.sin(
          x * .017
        ) * 20;

    }

    else{

      y =
        H * .65
        +
        Math.sin(
          x * .009
        ) * 75
        +
        Math.sin(
          x * .026
        ) * 30;

    }


    terrain.push({
      x:x,
      y:y
    });

  }

}


/* =========================================================
   GROUND HEIGHT
========================================================= */

function groundY(x){

  if(x <= 0){

    return terrain[0]
      ? terrain[0].y
      : H*.7;

  }


  let i =
    Math.floor(
      x / 20
    );


  if(
    i >=
    terrain.length - 1
  ){

    i =
      terrain.length - 2;

  }


  if(i < 0)
    i=0;


  const a =
    terrain[i];


  const b =
    terrain[i+1];


  const t =
    (
      x-a.x
    ) /
    (
      b.x-a.x
    );


  return (
    a.y +
    (
      b.y-a.y
    ) * t
  );

}


/* =========================================================
   CAR CREATION
========================================================= */

function createCar(
  x,
  color
){

  return {

    x:x,

    y:
      groundY(x)-35,

    vx:0,

    vy:0,

    angle:0,

    color:color,

    distance:x,

    finished:false

  };

}


/* =========================================================
   RACERS
========================================================= */

let racers =
  [];


let car;


/* =========================================================
   SINGLE PLAYER RACE
========================================================= */

function createSingleRace(){

  racers = [];


  /*
    USER
  */

  racers.push(
    createCar(
      100,
      "#2477ff"
    )
  );


  /*
    BOT 1
  */

  racers.push(
    createCar(
      50,
      "#e53935"
    )
  );


  /*
    BOT 2
  */

  racers.push(
    createCar(
      0,
      "#20b45a"
    )
  );


  /*
    BOT 3
  */

  racers.push(
    createCar(
      -50,
      "#ff8c00"
    )
  );


  car =
    racers[0];

}


/* =========================================================
   START SINGLE PLAYER
========================================================= */

function startSinglePlayer(){

  show("game");


  makeTerrain();


  createSingleRace();


  running =
    true;


  paused =
    false;


  $("pauseScreen")
    .classList.add(
      "hidden"
    );


  /*
    Reset buttons
  */

  accelerate =
    false;

  brake =
    false;


  startCountdown();


  /*
    IMPORTANT:
    Start the game loop.
  */

  cancelAnimationFrame(
    animationID
  );


  gameLoop();

}


/* =========================================================
   COUNTDOWN
========================================================= */

function startCountdown(){

  let n=3;


  $("countdown")
    .textContent =
    n;


  const timer =
    setInterval(
      function(){

        n--;


        if(n>0){

          $("countdown")
            .textContent =
            n;

        }

        else{

          $("countdown")
            .textContent =
            "GO!";


          setTimeout(
            function(){

              $("countdown")
                .textContent =
                "";

            },
            500
          );


          clearInterval(
            timer
          );

        }

      },
      700
    );

}


/* =========================================================
   MOBILE CONTROL VARIABLES
========================================================= */

let accelerate =
  false;


let brake =
  false;


const accelerateButton =
  $("accelerate");


const brakeButton =
  $("brake");


/* =========================================================
   ACCELERATE TOUCH CONTROL
========================================================= */

function accelerateStart(e){

  if(e){

    e.preventDefault();

    e.stopPropagation();

  }


  accelerate =
    true;


  /*
    Keep ownership of
    the touch pointer.
  */

  if(
    e &&
    e.pointerId !== undefined &&
    accelerateButton
      .setPointerCapture
  ){

    try{

      accelerateButton
        .setPointerCapture(
          e.pointerId
        );

    }
    catch(err){}

  }

}


function accelerateStop(e){

  if(e){

    e.preventDefault();

    e.stopPropagation();

  }


  accelerate =
    false;


  if(
    e &&
    e.pointerId !== undefined &&
    accelerateButton
      .releasePointerCapture
  ){

    try{

      accelerateButton
        .releasePointerCapture(
          e.pointerId
        );

    }
    catch(err){}

  }

}


/* =========================================================
   BRAKE TOUCH CONTROL
========================================================= */

function brakeStart(e){

  if(e){

    e.preventDefault();

    e.stopPropagation();

  }


  brake =
    true;


  if(
    e &&
    e.pointerId !== undefined &&
    brakeButton
      .setPointerCapture
  ){

    try{

      brakeButton
        .setPointerCapture(
          e.pointerId
        );

    }
    catch(err){}

  }

}


function brakeStop(e){

  if(e){

    e.preventDefault();

    e.stopPropagation();

  }


  brake =
    false;


  if(
    e &&
    e.pointerId !== undefined &&
    brakeButton
      .releasePointerCapture
