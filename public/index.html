<style>

/* =========================================================
   BASIC
========================================================= */

*{
  box-sizing:border-box;

  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;

html,
body{

  width:100%;

  margin:0;
  padding:0;

  overflow:hidden;

#pauseBtn{

========================================================= */

/* GREEN = ACCELERATE */

  max(
    20px,

}


/* RED = BRAKE */

  max(
    20px,

/* =========================================================

<script>

/* =========================================================
   HILL WARRIORS
   SOUND + TOUCH + FIXED DRIVING
========================================================= */

"use strict";


/* =========================================================
   HELPERS
========================================================= */

const $ =
id => document.getElementById(id);


/* =========================================================
   VARIABLES
========================================================= */

let playerName =
localStorage.getItem(
  "hillWarriorsName"
) || "";

let selectedMap =
"jungle";

let gameMode =
"single";

let running =
false;

let paused =
false;

let animationID;


/* =========================================================
   AUDIO SYSTEM
========================================================= */

let audioContext =
null;

let masterGain =
null;

let engineOsc =
null;

let engineGain =
null;

let soundEnabled =
true;


/* Initialize audio */

function initAudio(){

  if(audioContext)
    return;


  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;


  if(!AudioCtx)
    return;


  audioContext =
    new AudioCtx();


  masterGain =
    audioContext.createGain();


  masterGain.gain.value =
    0.35;


  masterGain.connect(
    audioContext.destination
  );

}


/* Resume audio */

function resumeAudio(){

  initAudio();


  if(
    audioContext &&
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


/* Simple sound */

function beep(
  frequency,
  duration,
  type="sine",
  volume=.12
){

  if(!soundEnabled)
    return;


  resumeAudio();


  if(!audioContext)
    return;


  const osc =
    audioContext.createOscillator();


  const gain =
    audioContext.createGain();


  osc.type =
    type;


  osc.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    0,
    audioContext.currentTime
  );


  gain.gain.linearRampToValueAtTime(
    volume,
    audioContext.currentTime+.01
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+
    duration
  );


  osc.connect(gain);

  gain.connect(masterGain);


  osc.start();

  osc.stop(
    audioContext.currentTime+
    duration+
    .03
  );

}


/* =========================================================
   SOUND EFFECTS
========================================================= */


/* Button click */

function soundClick(){

  beep(
    600,
    .08,
    "square",
    .08
  );

}


/* Countdown */

function soundCountdown(){

  beep(
    500,
    .16,
    "square",
    .13
  );

}


/* GO */

function soundGo(){

  beep(
    900,
    .35,
    "square",
    .15
  );

}


/* Brake */

function soundBrake(){

  beep(
    170,
    .12,
    "sawtooth",
    .10
  );

}


/* Landing */

function soundLanding(){

  beep(
    90,
    .12,
    "triangle",
    .12
  );

}


/* Crash */

function soundCrash(){

  beep(
    70,
    .35,
    "sawtooth",
    .16
  );

  setTimeout(
    function(){

      beep(
        45,
        .25,
        "square",
        .10
      );

    },
    100
  );

}


/* Finish */

function soundFinish(){

  beep(
    600,
    .15,
    "square",
    .12
  );

  setTimeout(
    function(){

      beep(
        800,
        .15,
        "square",
        .12
      );

    },
    160
  );

  setTimeout(
    function(){

      beep(
        1000,
        .35,
        "square",
        .14
      );

    },
    320
  );

}


/* =========================================================
   ENGINE SOUND
========================================================= */

function startEngine(){

  if(!soundEnabled)
    return;


  resumeAudio();


  if(
    !audioContext ||
    engineOsc
  )
    return;


  engineOsc =
    audioContext.createOscillator();


  engineGain =
    audioContext.createGain();


  engineOsc.type =
    "sawtooth";


  engineOsc.frequency.value =
    90;


  engineGain.gain.value =
    .025;


  engineOsc.connect(
    engineGain
  );


  engineGain.connect(
    masterGain
  );


  engineOsc.start();

}


function updateEngine(){

  if(
    !audioContext ||
    !engineOsc ||
    !engineGain
  )
    return;


  if(
    !running ||
    paused ||
    !soundEnabled
  ){

    engineGain.gain.setTargetAtTime(
      0,
      audioContext.currentTime,
      .05
    );

    return;

  }


  const speed =
    Math.abs(car.vx);


  const frequency =
    75 +
    Math.min(
      speed*35,
      300
    );


  engineOsc.frequency.setTargetAtTime(
    frequency,
    audioContext.currentTime,
    .04
  );


  const volume =
    .018 +
    Math.min(
      speed*.008,
      .045
    );


  engineGain.gain.setTargetAtTime(
    volume,
    audioContext.currentTime,
    .05
  );

}


/* Stop engine */

function stopEngine(){

  if(engineOsc){

    try{
      engineOsc.stop();
    }
    catch(err){}

  }

  engineOsc =
    null;

  engineGain =
    null;

}


/* =========================================================
   SOUND TOGGLE
========================================================= */

$("soundBtn").addEventListener(
  "click",
  function(){

    soundEnabled =
      !soundEnabled;


    $("soundBtn")
      .textContent =
      soundEnabled
      ? "🔊"
      : "🔇";


    if(soundEnabled){

      resumeAudio();

      startEngine();

      soundClick();

    }
    else{

      if(engineGain){

        engineGain.gain.value =
          0;

      }

    }

  }
);


/* =========================================================
   SCREEN MANAGEMENT
========================================================= */

function show(id){

  [
    "menu",
    "mode",
    "mapMenu",
    "lobby",
    "game"
  ]
  .forEach(
    x =>
    $(x)
    .classList
    .add("hidden")
  );


  $(id)
  .classList
  .remove("hidden");

}


/* =========================================================
   MAIN MENU
========================================================= */

$("playerName").value =
playerName;


$("startBtn").addEventListener(
  "click",
  function(){

    resumeAudio();

    soundClick();


    const name =
      $("playerName")
      .value
      .trim();


    if(!name){

      $("playerName")
      .focus();

      return;

    }


    playerName =
      name;


    localStorage.setItem(
      "hillWarriorsName",
      playerName
    );


    show("mode");

  }
);


/* =========================================================
   MODE
========================================================= */

$("singleBtn").addEventListener(
  "click",
  function(){

    soundClick();

    gameMode =
      "single";

    show("mapMenu");

  }
);


$("multiBtn").addEventListener(
  "click",
  function(){

    soundClick();

    gameMode =
      "multi";

    show("lobby");

  }
);


$("backBtn").addEventListener(
  "click",
  function(){

    soundClick();

    show("menu");

  }
);


/* =========================================================
   MAP
========================================================= */

document
.querySelectorAll(".mapBtn")
.forEach(
  btn => {

    btn.addEventListener(
      "click",
      function(){

        soundClick();

        selectedMap =
          btn.dataset.map;


        if(
          gameMode ===
          "single"
        ){

          startSinglePlayer();

        }

      }
    );

  }
);


$("mapBack").addEventListener(
  "click",
  function(){

    soundClick();

    show("mode");

  }
);


/* =========================================================
   CANVAS
========================================================= */

const canvas =
$("canvas");

const ctx =
canvas.getContext("2d");

let W;
let H;


function resize(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  W =
    window.innerWidth;

  H =
    window.innerHeight;


  canvas.width =
    W*dpr;

  canvas.height =
    H*dpr;


  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


window.addEventListener(
  "resize",
  resize
);


resize();


/* =========================================================
   TERRAIN
========================================================= */

let terrain =
[];


function makeTerrain(){

  terrain =
  [];


  for(
    let x=0;
    x<10000;
    x+=20
  ){

    let y;


    if(
      selectedMap ===
      "jungle"
    ){

      y =
      H*.70
      +
      Math.sin(
        x*.008
      )*55
      +
      Math.sin(
        x*.021
      )*25;

    }

    else if(
      selectedMap ===
      "sand"
    ){

      y =
      H*.72
      +
      Math.sin(
        x*.006
      )*65
      +
      Math.sin(
        x*.017
      )*20;

    }

    else{

      y =
      H*.65
      +
      Math.sin(
        x*.009
      )*75
      +
      Math.sin(
        x*.026
      )*30;

    }


    terrain.push({
      x:x,
      y:y
    });

  }

}


/* =========================================================
   GROUND
========================================================= */

function groundY(x){

  if(x<=0){

    return terrain[0]
      ? terrain[0].y
      : H*.7;

  }


  let i =
    Math.floor(
      x/20
    );


  if(
    i>=
    terrain.length-1
  ){

    i =
      terrain.length-2;

  }


  if(i<0)
    i=0;


  const a =
    terrain[i];

  const b =
    terrain[i+1];


  const t =
    (x-a.x)/
    (b.x-a.x);


  return (
    a.y+
    (b.y-a.y)*t
  );

}


/* =========================================================
   CAR
========================================================= */

function createCar(
  x,
  color
){

  return {

    x:x,

    y:
      groundY(x)-35,

    vx:0,

    vy:0,

    angle:0,

    color:color,

    distance:x,

    airborne:false,

    previousGround:false

  };

}


/* =========================================================
   RACERS
========================================================= */

let racers =
[];

let car;


/* =========================================================
   SINGLE PLAYER
===========================
