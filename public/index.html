<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Holi Warriors</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#062516;
  color:white;
  touch-action:none;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:linear-gradient(145deg,#062516,#15502f);
  overflow:auto;
}

.card{
  width:min(560px,94vw);
  max-height:94vh;
  overflow:auto;
  background:#103b28;
  border:2px solid #9ee5b8;
  border-radius:24px;
  padding:22px;
  box-shadow:0 15px 45px #0009;
  text-align:center;
}

h1{
  font-size:clamp(34px,7vw,58px);
  margin:0 0 5px;
}

.sub{
  font-size:14px;
  color:#bcefc9;
  margin-bottom:20px;
}

.field,
select{
  display:block;
  width:100%;
  padding:14px;
  border-radius:12px;
  border:2px solid #9ee5b8;
  background:#082719;
  color:white;
  text-align:center;
  margin:8px 0;
  outline:none;
}

.field:focus,
select:focus{
  border-color:#38d879;
}

.btn{
  display:block;
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px 10px;
  background:#3184e8;
  color:white;
  font-weight:800;
  margin:8px 0;
  min-height:50px;
}

.btn.green{
  background:#27a45d;
}

.btn.orange{
  background:#e16b2d;
}

.btn.gray{
  background:#52645a;
}

.btn:active{
  transform:scale(.98);
}

.hidden{
  display:none!important;
}

.pill{
  display:inline-block;
  padding:8px 12px;
  border-radius:999px;
  background:#092519;
  border:1px solid #6db98b;
  margin:5px;
}

.small{
  font-size:13px;
  color:#c9efd4;
}

#game{
  position:fixed;
  inset:0;
  display:none;
  overflow:hidden;
  background:#76c955;
}

#hud{
  position:absolute;
  top:max(6px,env(safe-area-inset-top));
  left:6px;
  right:6px;
  display:flex;
  gap:6px;
  z-index:20;
  pointer-events:none;
}

.hud{
  background:#123b28dd;
  border:2px solid #9ee5b8;
  border-radius:11px;
  padding:6px 8px;
  min-width:0;
  flex:1;
  text-align:center;
  font-size:12px;
}

.hud b{
  font-size:15px;
}

#pause{
  position:absolute;
  right:6px;
  top:58px;
  z-index:30;
  background:#123b28;
  color:white;
  border:2px solid #9ee5b8;
  border-radius:10px;
  padding:8px 10px;
}

#arena{
  position:absolute;
  left:5%;
  right:5%;
  top:66px;
  bottom:96px;
  border:3px solid #d9f5cf;
  border-radius:8px;
  overflow:hidden;
  background:#76c955;
}

#world{
  position:absolute;
  inset:0;
}

.player{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 4px 7px #0007;
  transform-origin:center;
}

.player::after{
  content:"";
  position:absolute;
  width:25px;
  height:8px;
  right:-19px;
  top:14px;
  background:#ef7d35;
  border-radius:4px;
}

.blue{
  background:#12aee0;
}

.red{
  background:#ef4b55;
}

.label{
  position:absolute;
  top:-19px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  font-weight:bold;
  white-space:nowrap;
  text-shadow:0 1px 2px #000;
}

.hp{
  position:absolute;
  top:-7px;
  left:50%;
  transform:translateX(-50%);
  height:5px;
  width:44px;
  background:#222;
  border-radius:4px;
  overflow:hidden;
}

.hp i{
  display:block;
  height:100%;
  background:#37dc65;
}

.balloon{
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#f7c23b;
  border:1px solid white;
  pointer-events:none;
  box-shadow:0 0 7px #fff8;
}

.block{
  position:absolute;
  background:#704723;
  border:2px solid #573417;
  border-radius:5px;
}

#leftControl,
#rightControl{
  position:absolute;
  bottom:8px;
  width:118px;
  height:118px;
  border-radius:50%;
  border:3px solid #dff4e5aa;
  background:#123b2870;
  z-index:30;
}

#leftControl{
  left:18px;
}

.stick{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#dff4e5cc;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px solid #9bc9aa;
}

#rightControl{
  right:18px;
}

.fireCore{
  position:absolute;
  left:50%;
  top:50%;
  width:68px;
  height:68px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#ff6a2a;
  border:4px solid #ffd2bb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.overlay{
  position:absolute;
  inset:0;
  background:#061b10df;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.overlay .card{
  max-width:430px;
}

.countdown{
  font-size:50px;
  font-weight:900;
  color:#ffd65a;
}

@media(max-height:420px){

  #arena{
    top:60px;
    bottom:82px;
  }

  #leftControl,
  #rightControl{
    width:88px;
    height:88px;
    bottom:4px;
  }

  .stick{
    width:44px;
    height:44px;
  }

  .fireCore{
    width:54px;
    height:54px;
  }

  .player{
    width:32px;
    height:32px;
  }

  .player::after{
    top:11px;
  }

  .hud{
    padding:4px 6px;
  }

  .hud b{
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- MAIN MENU -->
<div id="menu" class="screen">

<div class="card">

<h1>🌈 HOLI WARRIORS</h1>

<div class="sub">
Developed by Prabhat Kumar Singh
</div>

<!-- NAME -->
<div id="nameStep">

<input
  id="nameInput"
  class="field"
  maxlength="18"
  autocomplete="name"
  placeholder="Enter your name"
>

<button
  type="button"
  class="btn green"
  id="saveName"
>
CONTINUE
</button>

</div>

<!-- MODE -->
<div id="modeStep" class="hidden">

<div class="pill">
Player: <b id="savedName"></b>
</div>

<button type="button" class="btn green" id="singleBtn">
SINGLE PLAYER
</button>

<button type="button" class="btn" id="multiBtn">
MULTIPLAYER
</button>

<button type="button" class="btn gray" id="changeName">
CHANGE NAME
</button>

</div>

<!-- SINGLE PLAYER SETUP -->
<div id="singleSetup" class="hidden">

<h2>Single Player</h2>

<select id="singleMap">
<option value="jungle">🌿 Jungle</option>
<option value="sand">🏜️ Sand</option>
<option value="space">🚀 Space</option>
</select>

<select id="singleTime">
<option value="180">3 minutes</option>
<option value="60">1 minute</option>
<option value="120">2 minutes</option>
<option value="300">5 minutes</option>
</select>

<select id="levelSel"></select>

<button type="button" class="btn green" id="startSingle">
START BATTLE
</button>

<button type="button" class="btn gray" id="backSingle">
BACK
</button>

</div>

<!-- MULTIPLAYER -->
<div id="multiSetup" class="hidden">

<h2>Multiplayer Lobby</h2>

<select id="multiMap">
<option value="jungle">🌿 Jungle</option>
<option value="sand">🏜️ Sand</option>
<option value="space">🚀 Space</option>
</select>

<select id="multiTime">
<option value="180">3 minutes</option>
<option value="60">1 minute</option>
<option value="120">2 minutes</option>
<option value="300">5 minutes</option>
</select>

<button type="button" class="btn green" id="createRoom">
CREATE ROOM
</button>

<input
  id="roomInput"
  class="field"
  maxlength="6"
  autocomplete="off"
  placeholder="Enter room code"
>

<button type="button" class="btn" id="joinRoom">
JOIN ROOM
</button>

<div id="lobby" class="hidden">

<h2>
Room: <span id="roomCode"></span>
</h2>

<div id="lobbyPlayers" class="small">
Waiting for players...
</div>

<button type="button" class="btn green" id="readyBtn">
READY
</button>

<button type="button" class="btn gray" id="leaveRoom">
LEAVE ROOM
</button>

</div>

<div id="multiStatus" class="small">
Create a room or join one.
The battle starts only after Ready.
</div>

<button type="button" class="btn gray" id="backMulti">
BACK
</button>

</div>

</div>
</div>


<!-- GAME -->
<div id="game">

<div id="hud">

<div class="hud">
<b>🔵 BLUE</b>
<div id="blueScore">0</div>
</div>

<div class="hud">
<b id="timer">03:00</b>
<div id="roomText" class="small"></div>
</div>

<div class="hud">
<b>🔴 RED</b>
<div id="redScore">0</div>
</div>

</div>

<button type="button" id="pause">
⏸
</button>

<div id="arena">
<div id="world"></div>
</div>

<div id="leftControl">
<div class="stick"></div>
</div>

<div id="rightControl">
<div class="fireCore">💦</div>
</div>


<!-- PAUSE -->
<div id="pauseOverlay" class="overlay">

<div class="card">

<h2>PAUSED</h2>

<button type="button" class="btn green" id="resumeBtn">
RESUME
</button>

<button type="button" class="btn orange" id="restartBtn">
RESTART
</button>

<button type="button" class="btn" id="menuBtn">
MAIN MENU
</button>

</div>

</div>


<!-- OUT -->
<div id="outOverlay" class="overlay">

<div class="card">

<h2>YOU ARE OUT</h2>

<div class="countdown" id="outCount">
10
</div>

<p>
Back in the game soon.
</p>

</div>

</div>


<!-- END -->
<div id="endOverlay" class="overlay">

<div class="card">

<h2 id="resultTitle">
ROUND OVER
</h2>

<p id="resultText"></p>

<button type="button" class="btn green" id="againBtn">
PLAY AGAIN
</button>

<button type="button" class="btn" id="nextBtn">
NEXT LEVEL
</button>

<button type="button" class="btn gray" id="endMenuBtn">
MAIN MENU
</button>

</div>

</div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

"use strict";

const $ = id => document.getElementById(id);

let playerName = localStorage.getItem("holiName") || "";

let mode = "single";
let map = "jungle";
let roundSeconds = 180;
let level = 1;
let room = "";
let ws = null;

let running = false;
let paused = false;
let last = 0;
let timer = 180;

let left = {x:0,y:0};
let angle = 0;
let fireHeld = false;
let lastShot = 0;

/* Slow one-ball-at-a-time throwing */
const shotCooldown = 900;

let me = null;
let entities = {};
let projectiles = {};

let activeBotSlots = 0;
let remainingBots = 0;

let blueScore = 0;
let redScore = 0;


/* LEVELS */

for(let i=1;i<=10;i++){

  const option = document.createElement("option");

  option.value = i;
  option.textContent = "Level " + i;

  $("levelSel").appendChild(option);

}

$("levelSel").value = "1";


/* SCREEN CONTROL */

function show(id){

  [
    "nameStep",
    "modeStep",
    "singleSetup",
    "multiSetup"
  ].forEach(function(x){

    $(x).classList.add("hidden");

  });

  $(id).classList.remove("hidden");

}


/* NAME */

function initName(){

  if(playerName){

    $("nameInput").value = playerName;
    $("savedName").textContent = playerName;

    show("modeStep");

  }else{

    show("nameStep");

  }

}


/* FIXED CONTINUE BUTTON */

$("saveName").addEventListener("click", function(e){

  e.preventDefault();
  e.stopPropagation();

  const n = $("nameInput").value.trim();

  if(!n){

    $("nameInput").focus();
    $("nameInput").placeholder = "Please enter your name";

    return;

  }

  playerName = n;

  localStorage.setItem("holiName", playerName);

  $("savedName").textContent = playerName;

  show("modeStep");

});


$("nameInput").addEventListener("keydown", function(e){

  if(e.key === "Enter"){

    e.preventDefault();

    $("saveName").click();

  }

});


$("changeName").addEventListener("click", function(){

  show("nameStep");
  $("nameInput").focus();

});


/* MODE */

$("singleBtn").addEventListener("click", function(){

  mode = "single";

  show("singleSetup");

});


$("multiBtn").addEventListener("click", function(){

  mode = "multi";

  show("multiSetup");

});


$("backSingle").addEventListener("click", function(){

  show("modeStep");

});


$("backMulti").addEventListener("click", function(){

  disconnect();

  show("modeStep");

});


$("levelSel").addEventListener("change", function(){

  level = Number(this.value);

});


/* MAPS */

const maps = {

  jungle:["#76c955","#3c8d2b"],
  sand:["#c89a5b","#a9793e"],
  space:["#050817","#111a3c"]

};


function setMap(){

  const c = maps[map];

  $("game").style.background = c[0];

  $("world").style.backgroundColor = c[0];

  if(map === "space"){

    $("world").style.backgroundImage =
      "radial-gradient(circle at 20% 20%,#fff 1px,transparent 2px)," +
      "radial-gradient(circle at 75% 35%,#fff 1px,transparent 2px)," +
      "radial-gradient(circle at 55% 80%,#fff 1px,transparent 2px)";

  }else{

    $("world").style.backgroundImage =
      "linear-gradient(#0001 1px,transparent 1px)," +
      "linear-gradient(90deg,#0001 1px,transparent 1px)";

  }

}


/* BLOCKS */

function drawBlocks(){

  document.querySelectorAll(".block").forEach(function(e){

    e.remove();

  });

  [
    [7,9,20,15],
    [72,9,20,15],
    [38,32,24,14],
    [7,67,20,14],
    [72,66,20,14]
  ].forEach(function(a){

    const e = document.createElement("div");

    e.className = "block";

    e.style.cssText =
      `left:${a[0]}%;top:${a[1]}%;width:${a[2]}%;height:${a[3]}%`;

    $("world").appendChild(e);

  });

}


/* WORLD */

function resetWorld(){

  Object.values(projectiles).forEach(function(p){

    if(p.el) p.el.remove();

  });

  projectiles = {};

  $("world").querySelectorAll(".player").forEach(function(e){

    e.remove();

  });

  entities = {};

  blueScore = 0;
  redScore = 0;

}


function makeEntity(p){

  return {
    ...p,
    hp:p.hp ?? 100,
    outUntil:p.outUntil || 0,
    angle:p.angle || 0
  };

}


function addEntity(p){

  entities[p.id] = makeEntity(p);

  render(entities[p.id]);

}


function render(p){

  let e = document.getElementById("p_" + p.id);

  if(!e){

    e = document.createElement("div");

    e.id = "p_" + p.id;

    e.className =
      "player " + (p.team === "blue" ? "blue" : "red");

    e.innerHTML =
      '<div class="label"></div>' +
      '<div class="hp"><i></i></div>';

    $("world").appendChild(e);

  }

  e.style.left = p.x + "%";
  e.style.top = p.y + "%";

  e.style.transform =
    `rotate(${p.angle || 0}rad)`;

  e.style.opacity =
    p.outUntil > Date.now() ? "0" : "1";

  e.querySelector(".label").textContent =
    p.id === me?.id
      ? "YOU"
      : (p.name || "BOT");

  e.querySelector(".hp i").style.width =
    Math.max(0,p.hp) + "%";

}


/* BOT */

function makeBot(i,team,owner){

  return makeEntity({

    id:"bot" + i,

    name:"BOT " + (i+1),

    team:team,

    x:team === "blue"
      ? 12 + Math.random()*25
      : 63 + Math.random()*25,

    y:15 + Math.random()*70,

    hp:100,

    angle:team === "blue" ? 0 : Math.PI,

    bot:true,

    owner:owner

  });

}


/* SINGLE PLAYER */

function startSingle(){

  disconnect();

  mode = "single";

  map = $("singleMap").value;

  roundSeconds = Number($("singleTime").value);

  level = Number($("levelSel").value);

  timer = roundSeconds;

  resetWorld();

  me = makeEntity({

    id:"me",

    name:playerName,

    team:"blue",

    x:12,

    y:50,

    hp:1000,

    score:0,

    angle:0

  });

  addEntity(me);

  remainingBots = level;

  activeBotSlots = Math.min(2,level);

  for(let i=0;i<activeBotSlots;i++){

    addEntity(makeBot(i,"red","me"));

  }

  beginGame();

}


$("startSingle").addEventListener("click",startSingle);


/* START GAME */

function beginGame(){

  $("menu").style.display = "none";

  $("game").style.display = "block";

  setMap();

  drawBlocks();

  $("roomText").textContent =
    mode === "multi"
      ? "ROOM " + room
      : "LEVEL " + level;

  running = true;
  paused = false;

  last = performance.now();

  requestAnimationFrame(loop);

}


/* TIME */

function formatTime(s){

  s = Math.max(0,Math.ceil(s));

  return String(Math.floor(s/60)).padStart(2,"0")
    + ":" +
    String(s%60).padStart(2,"0");

}


/* SHOOT */

function shoot(ownerId){

  const p = entities[ownerId];

  if(!p || p.outUntil > Date.now()) return;

  const now = Date.now();

  if(now - lastShot < shotCooldown) return;

  lastShot = now;

  const id =
    "b" + Math.random().toString(36).slice(2,9);

  const b = {

    id:id,
    owner:ownerId,
    team:p.team,
    x:p.x,
    y:p.y,
    angle:p.angle || 0,
    el:document.createElement("div"),
    speed:58,
    life:0

  };

  b.el.className = "balloon";

  b.el.style.left = b.x + "%";
  b.el.style.top = b.y + "%";

  $("world").appendChild(b.el);

  projectiles[id] = b;

  if(mode === "multi" && ws?.readyState === 1){

    ws.send(JSON.stringify({

      type:"balloon",
      balloon:{
        id:id,
        owner:ownerId,
        team:p.team,
        x:p.x,
        y:p.y,
        angle:p.angle || 0
      }

    }));

  }

}


function receiveBalloon(b){

  if(projectiles[b.id]) return;

  const p = {

    ...b,
    el:document.createElement("div"),
    speed:58,
    life:0

  };

  p.el.className = "balloon";

  p.el.style.left = p.x + "%";
  p.el.style.top = p.y + "%";

  $("world").appendChild(p.el);

  projectiles[b.id] = p;

}


/* HIT */

function hitCheck(b){

  const targets =
    Object.values(entities).filter(function(q){

      return q.team !== b.team &&
             q.outUntil <= Date.now();

    });

  for(const q of targets){

    if(Math.hypot(q.x-b.x,q.y-b.y) < 3.8){

      q.hp -= 10;

      if(q.hp <= 0){

        q.hp = 0;

        q.outUntil = Date.now() + 10000;

        const scorer = entities[b.owner];

        if(scorer){

          scorer.score = (scorer.score || 0) + 10;

          if(scorer.team === "blue")
            blueScore += 10;
          else
            redScore += 10;

        }

      }

      if(mode === "multi" && ws?.readyState === 1){

        ws.send(JSON.stringify({

          type:"hit",
          targetId:q.id

        }));

      }

      return true;

    }

  }

  return false;

}


/* PROJECTILES */

function updateProjectiles(dt){

  for(const id in projectiles){

    const b = projectiles[id];

    b.x += Math.cos(b.angle) * b.speed * dt / 100;
    b.y += Math.sin(b.angle) * b.speed * dt / 100;

    b.life += dt;

    b.el.style.left = b.x + "%";
    b.el.style.top = b.y + "%";

    if(
      hitCheck(b) ||
      b.x < 0 ||
      b.x > 100 ||
      b.y < 0 ||
      b.y > 100 ||
      b.life > 2
    ){

      b.el.remove();

      delete projectiles[id];

    }

  }

}


/* BOT AI */

function botAI(dt){

  const now = Date.now();

  Object.values(entities)
    .filter(p => p.bot && p.owner === me?.id)
    .forEach(function(b){

      if(b.outUntil > now) return;

      const enemies =
        Object.values(entities)
        .filter(q =>
          q.team !== b.team &&
          q.outUntil <= now
        );

      if(!enemies.length) return;

      const t = enemies[0];

      const a =
        Math.atan2(t.y-b.y,t.x-b.x);

      b.angle = a;

      b.x += Math.cos(a) * dt * 7;
      b.y += Math.sin(a) * dt * 7;

      if(Math.random() < dt*1.2){

        const old = lastShot;

        lastShot = 0;

        shoot(b.id);

        lastShot = old;

      }

    });

}


/* SCORE */

function updateScores(){

  Object.values(entities).forEach(render);

  $("blueScore").textContent =
    blueScore + " points";

  $("redScore").textContent =
    redScore + " points";

  $("timer").textContent =
    formatTime(timer);

}


/* FINISH */

function finishRound(){

  running = false;

  $("endOverlay").style.display = "flex";

  if(mode === "single"){

    const botsLeft =
      Object.values(entities)
