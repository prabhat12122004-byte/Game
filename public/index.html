<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#172b18">

<title>Hill Warriors</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}


/* =====================================================
   SCREENS
===================================================== */

.screen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}


/* =====================================================
   MAIN MENU
===================================================== */

#menu{
  background:linear-gradient(#172b18,#315d2c);
  color:white;
  text-align:center;
  padding:20px;
}

.menuBox{
  width:min(430px,90vw);
}

.logo{
  font-size:clamp(42px,9vw,78px);
  font-weight:900;
  color:#ffd83d;
  text-shadow:4px 4px #000;
}

.developer{
  font-size:18px;
  margin-top:8px;
}

input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  font-size:18px;
  text-align:center;
  margin:20px 0 10px;
  -webkit-user-select:text;
  user-select:text;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 22px;
  margin:7px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

button:active{
  transform:scale(.95);
}

.primary{
  background:#ffd83d;
  color:#111;
}

.secondary{
  background:#eee;
  color:#111;
}

.hidden{
  display:none!important;
}


/* =====================================================
   GAME
===================================================== */

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#80cfff;
  touch-action:none;
}

#canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  touch-action:none;
}


/* =====================================================
   HUD
===================================================== */

#hud{
  position:absolute;
  left:12px;
  top:10px;
  z-index:20;
  color:white;
  font-size:18px;
  font-weight:bold;
  line-height:1.45;
  text-shadow:2px 2px #000;
  pointer-events:none;
}

#pauseBtn{
  position:absolute;
  right:15px;
  top:12px;
  z-index:50;
  margin:0;
  background:white;
}


/* =====================================================
   SOUND BUTTON
===================================================== */

#soundBtn{
  position:absolute;
  right:15px;
  top:75px;
  width:48px;
  height:48px;
  margin:0;
  padding:0;
  border-radius:50%;
  background:white;
  font-size:21px;
  z-index:50;
}


/* =====================================================
   DRIVING BUTTONS
===================================================== */

.control{
  position:absolute;

  bottom:
  max(18px,env(safe-area-inset-bottom));

  width:120px;
  height:80px;

  margin:0;
  padding:0;

  border-radius:50%;

  z-index:100;

  font-size:0;
  color:transparent;

  border:4px solid rgba(255,255,255,.35);

  touch-action:none;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;

  -webkit-tap-highlight-color:transparent;

  box-shadow:0 5px 15px rgba(0,0,0,.45);
}

#accelerate{
  right:max(20px,env(safe-area-inset-right));
  background:#16a34a;
}

#brake{
  left:max(20px,env(safe-area-inset-left));
  background:#dc2626;
}

.control:active{
  transform:scale(.92);
}


/* =====================================================
   PAUSE
===================================================== */

#pauseScreen{
  position:absolute;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.72);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#pauseScreen h1{
  font-size:50px;
}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdown{
  position:absolute;
  inset:0;
  z-index:150;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  font-size:100px;
  font-weight:900;

  text-shadow:5px 5px #000;

  pointer-events:none;
}


/* =====================================================
   MULTIPLAYER
===================================================== */

#lobby{
  background:#172b18;
  color:white;
  text-align:center;
  padding:20px;
}

#players{
  width:min(450px,90vw);
  margin:20px auto;
  text-align:left;
}

.player{
  background:#333;
  margin:5px 0;
  padding:10px;
  border-radius:8px;
}


/* =====================================================
   SMALL LANDSCAPE SCREENS
===================================================== */

@media(max-height:500px){

  #hud{
    font-size:14px;
    top:7px;
    left:8px;
  }

  #pauseBtn{
    top:7px;
    right:8px;
    padding:9px 14px;
  }

  #soundBtn{
    top:65px;
    right:8px;
    width:42px;
    height:42px;
  }

  .control{
    width:95px;
    height:65px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     MAIN MENU
===================================================== -->

<div id="menu" class="screen">

  <div class="menuBox">

    <div class="logo">
      HILL WARRIORS
    </div>

    <div class="developer">
      Developed by Prabhat Kumar Singh
    </div>

    <input
      id="playerName"
      type="text"
      maxlength="18"
      placeholder="Enter your name"
      autocomplete="off">

    <button
      id="startBtn"
      class="primary"
      type="button">
      START GAME
    </button>

  </div>

</div>


<!-- =====================================================
     MODE
===================================================== -->

<div
id="mode"
class="screen hidden"
style="
background:#172b18;
color:white;
text-align:center;
">

  <div>

    <h1>HILL WARRIORS</h1>

    <h2>Choose Game Mode</h2>

    <button
      id="singleBtn"
      class="primary"
      type="button">
      SINGLE PLAYER
    </button>

    <button
      id="multiBtn"
      class="secondary"
      type="button">
      MULTIPLAYER
    </button>

    <br>

    <button
      id="backBtn"
      class="secondary"
      type="button">
      BACK
    </button>

  </div>

</div>


<!-- =====================================================
     MAP
===================================================== -->

<div
id="mapMenu"
class="screen hidden"
style="
background:#172b18;
color:white;
text-align:center;
">

  <div>

    <h1>SELECT MAP</h1>

    <button
      class="primary mapBtn"
      data-map="jungle"
      type="button">
      🌴 JUNGLE
    </button>

    <button
      class="primary mapBtn"
      data-map="sand"
      type="button">
      🏜️ SAND
    </button>

    <button
      class="primary mapBtn"
      data-map="space"
      type="button">
      🚀 SPACE
    </button>

    <br>

    <button
      id="mapBack"
      class="secondary"
      type="button">
      BACK
    </button>

  </div>

</div>


<!-- =====================================================
     MULTIPLAYER LOBBY
===================================================== -->

<div id="lobby" class="screen hidden">

  <div>

    <h1>MULTIPLAYER</h1>

    <p>Maximum 4 players</p>

    <input
      id="roomCode"
      placeholder="Enter room code"
      autocomplete="off">

    <br>

    <button
      id="joinBtn"
      class="primary"
      type="button">
      JOIN ROOM
    </button>

    <button
      id="createBtn"
      class="secondary"
      type="button">
      CREATE ROOM
    </button>

    <h2 id="roomTitle"></h2>

    <div id="players"></div>

    <button
      id="readyBtn"
      class="primary hidden"
      type="button">
      READY
    </button>

    <button
      id="lobbyBack"
      class="secondary"
      type="button">
      MAIN MENU
    </button>

  </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game" class="hidden">

  <canvas id="canvas"></canvas>

  <div id="hud">

    Distance:
    <span id="distance">0</span> m

    <br>

    Position:
    <span id="position">1</span>/4

    <br>

    Fuel:
    <span id="fuel">100</span>%

  </div>


  <button
    id="pauseBtn"
    type="button">
    PAUSE
  </button>


  <button
    id="soundBtn"
    type="button">
    🔊
  </button>


  <!-- GREEN ACCELERATOR -->

  <button
    id="accelerate"
    class="control"
    type="button"
    aria-label="Accelerate">
  </button>


  <!-- RED BRAKE -->

  <button
    id="brake"
    class="control"
    type="button"
    aria-label="Brake">
  </button>


  <!-- PAUSE -->

  <div
    id="pauseScreen"
    class="hidden">

    <h1>PAUSED</h1>

    <button
      id="resumeBtn"
      class="primary"
      type="button">
      RESUME
    </button>

    <button
      id="menuBtn"
      class="secondary"
      type="button">
      MAIN MENU
    </button>

  </div>


  <div id="countdown"></div>

</div>



<script>

/* =====================================================
   HILL WARRIORS
===================================================== */

"use strict";


/* =====================================================
   HELPER
===================================================== */

function $(id){

  return document.getElementById(id);

}


/* =====================================================
   VARIABLES
===================================================== */

let playerName =
  localStorage.getItem("hillWarriorsName") || "";

let selectedMap =
  "jungle";

let gameMode =
  "single";

let running =
  false;

let paused =
  false;

let animationID =
  0;

let racers =
  [];

let car =
  null;

let terrain =
  [];

let accelerate =
  false;

let brake =
  false;


/* =====================================================
   AUDIO
===================================================== */

let audioContext =
  null;

let masterGain =
  null;

let engineOsc =
  null;

let engineGain =
  null;

let soundEnabled =
  true;


function initAudio(){

  if(audioContext)
    return true;

  try{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass)
      return false;

    audioContext =
      new AudioContextClass();

    masterGain =
      audioContext.createGain();

    masterGain.gain.value =
      0.25;

    masterGain.connect(
      audioContext.destination
    );

    return true;

  }
  catch(error){

    console.log(
      "Audio unavailable",
      error
    );

    audioContext =
      null;

    return false;

  }

}


function resumeAudio(){

  if(!soundEnabled)
    return;

  if(!initAudio())
    return;

  try{

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }
  catch(error){}

}


function beep(
  frequency,
  duration,
  type,
  volume
){

  if(!soundEnabled)
    return;

  if(!initAudio())
    return;

  try{

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      type || "sine";

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      0,
      audioContext.currentTime
    );

    gain.gain.linearRampToValueAtTime(
      volume || .1,
      audioContext.currentTime+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+
      duration
    );

    oscillator.connect(gain);

    gain.connect(masterGain);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime+
      duration+
      .03
    );

  }
  catch(error){}

}


function startEngine(){

  if(!soundEnabled)
    return;

  if(!initAudio())
    return;

  if(engineOsc)
    return;

  try{

    engineOsc =
      audioContext.createOscillator();

    engineGain =
      audioContext.createGain();

    engineOsc.type =
      "sawtooth";

    engineOsc.frequency.value =
      90;

    engineGain.gain.value =
      .02;

    engineOsc.connect(
      engineGain
    );

    engineGain.connect(
      masterGain
    );

    engineOsc.start();

  }
  catch(error){

    engineOsc =
      null;

    engineGain =
      null;

  }

}


function updateEngineSound(){

  if(
    !engineOsc ||
    !engineGain ||
    !audioContext
  )
    return;

  try{

    if(
      !running ||
      paused ||
      !soundEnabled
    ){

      engineGain.gain.setTargetAtTime(
        0,
        audioContext.currentTime,
        .05
      );

      return;

    }

    const speed =
      Math.abs(
        car.vx
      );

    engineOsc.frequency.setTargetAtTime(
      80 + speed*30,
      audioContext.currentTime,
      .04
    );

    engineGain.gain.setTargetAtTime(
      .018 + speed*.006,
      audioContext.currentTime,
      .05
    );

  }
  catch(error){}

}


function stopEngine(){

  if(engineOsc){

    try{
      engineOsc.stop();
    }
    catch(error){}

  }

  engineOsc =
    null;

  engineGain =
    null;

}


/* =====================================================
   SOUND BUTTON
===================================================== */

$("soundBtn").addEventListener(
  "click",
  function(){

    soundEnabled =
      !soundEnabled;

    $("soundBtn").textContent =
      soundEnabled
      ? "🔊"
      : "🔇";

    if(soundEnabled){

      resumeAudio();

      beep(
        700,
        .1,
        "square",
        .08
      );

      if(running)
        startEngine();

    }
    else{

      if(engineGain){

        try{

          engineGain.gain.value =
            0;

        }
        catch(error){}

      }

    }

  }
);


/* =====================================================
   SCREEN FUNCTION
===================================================== */

function showScreen(id){

  const screens = [
    "menu",
    "mode",
    "mapMenu",
    "lobby",
    "game"
  ];

  screens.forEach(
    function(screen){

      $(screen)
        .classList
        .add("hidden");

    }
  );

  $(id)
    .classList
    .remove("hidden");

}


/* =====================================================
   MAIN MENU
===================================================== */

$("playerName").value =
  playerName;


$("startBtn").addEventListener(
  "click",
  function(){

    /*
      IMPORTANT:
      Audio is attempted only
      AFTER the button press.
      Audio failure can never
      stop this button.
    */

    const name =
      $("playerName")
      .value
      .trim();

    if(!name){

      $("playerName")
        .focus();

      $("playerName")
        .placeholder =
        "Please enter your name";

      return;

    }

    playerName =
      name;

    try{

      localStorage.setItem(
        "hillWarriorsName",
        playerName
      );

    }
    catch(error){}

    resumeAudio();

    beep(
      650,
      .1,
      "square",
      .08
    );

    showScreen("mode");

  }
);


/* =====================================================
   MODE BUTTONS
===================================================== */

$("singleBtn").addEventListener(
  "click",
  function(){

    beep(
      600,
      .08,
      "square",
      .07
    );

    gameMode =
      "single";

    showScreen("mapMenu");

  }
);


$("multiBtn").addEventListener(
  "click",
  function(){

    beep(
      600,
      .08,
      "square",
      .07
    );

    gameMode =
      "multi";

    showScreen("lobby");

  }
);


$("backBtn").addEventListener(
  "click",
  function(){

    showScreen("menu");

  }
);


/* =====================================================
   MAP BUTTONS
===================================================== */

document
.querySelectorAll(".mapBtn")
.forEach(
  function(button){

    button.addEventListener(
      "click",
      function(){

        selectedMap =
          button.dataset.map;

        beep(
          700,
          .08,
          "square",
          .07
        );

        startSinglePlayer();

      }
    );

  }
);


$("mapBack").addEventListener(
  "click",
  function(){

    showScreen("mode");

  }
);


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  $("canvas");

const ctx =
  canvas.getContext("2d");

let W =
  window.innerWidth;

let H =
  window.innerHeight;


function resizeCanvas(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    W*dpr;

  canvas.height =
    H*dpr;

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =====================================================
   TERRAIN
===================================================== */

function makeTerrain(){

  terrain = [];

  for(
    let x=0;
    x<12000;
    x+=20
  ){

    let y;

    if(
      selectedMap ===
      "jungle"
    ){

      y =
        H*.70 +
        Math.sin(x*.008)*55 +
        Math.sin(x*.021)*25;

    }
    else if(
      selectedMap ===
      "sand"
    ){

      y =
        H*.72 +
        Math.sin(x*.006)*65 +
        Math.sin(x*.017)*20;

    }
    else{

      y =
        H*.65 +
        Math.sin(x*.009)*75 +
        Math.sin(x*.026)*30;

    }

    terrain.push({
      x:x,
      y:y
    });

  }

}


function groundY(x){

  if(
    !terrain.length
  ){

    return H*.7;

  }

  if(x<=0){

    return terrain[0].y;

  }

  let index =
    Math.floor(x/20);

  if(
    index >=
    terrain.length-1
  ){

    index =
      terrain.length-2;

  }

  if(index<0)
    index=0;

  const a =
    terrain[index];

  const b =
    terrain[index+1];

  const ratio =
    (x-a.x)/
    (b.x-a.x);

  return (
    a.y+
    (b.y-a.y)*ratio
  );

}


/* =====================================================
   CAR
===================================================== */

function createCar(
  x,
  color
){

  return {

    x:x,

    y:
      groundY(x)-35,

    vx:0,

    vy:0,

    angle:0,

    color:color,

    airborne:false

  };

}


/* =====================================================
   SINGLE RACE
===================================================== */

function createSingleRace(){

  racers = [

    createCar(
      100,
      "#2477ff"
    ),

    createCar(
      50,
      "#e53935"
    ),

    createCar(
      0,
      "#20b45a"
    ),

    createCar(
      -50,
      "#ff8c00"
    )

  ];

  car =
    racers[0];

}


/* =====================================================
   START SINGLE
===================================================== */

function startSinglePlayer(){

  showScreen("game");

  makeTerrain();

  createSingleRace();

  running =
    true;

  paused =
    false;

  accelerate =
    false;

  brake =
    false;

  $("pauseScreen")
    .classList
    .add("hidden");

  cancelAnimationFrame(
    animationID
  );

  resumeAudio();

  startEngine();

  startCountdown();

  gameLoop();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(){

  let number =
    3;

  $("countdown")
    .textContent =
    number;

  beep(
    500,
    .15,
    "square",
    .1
  );

  const timer =
    setInterval(
      function(){

        number--;

        if(number>0){

          $("countdown")
            .textContent =
            number;

          beep(
            50
