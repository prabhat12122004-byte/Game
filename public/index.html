<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Hill Warriors</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
    touch-action:none;
}

.hidden{
    display:none !important;
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#menu{
    background:linear-gradient(#172b18,#315d2c);
    color:white;
    text-align:center;
}

.menuBox{
    width:min(430px,90%);
}

.logo{
    font-size:clamp(42px,9vw,80px);
    font-weight:900;
    color:#ffd83d;
    text-shadow:4px 4px #000;
}

.developer{
    margin-top:8px;
    font-size:18px;
}

input{
    width:100%;
    padding:15px;
    margin:25px 0 10px;
    border:0;
    border-radius:10px;
    font-size:18px;
    text-align:center;
    -webkit-user-select:text;
    user-select:text;
}

button{
    border:0;
    border-radius:12px;
    padding:15px 24px;
    margin:7px;
    font-size:18px;
    font-weight:bold;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

button:active{
    transform:scale(.95);
}

.primary{
    background:#ffd83d;
    color:#111;
}

.secondary{
    background:#eee;
    color:#111;
}


/* GAME */

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#80cfff;
    touch-action:none;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    left:12px;
    top:10px;
    z-index:20;
    color:white;
    font-size:18px;
    font-weight:bold;
    line-height:1.5;
    text-shadow:2px 2px #000;
    pointer-events:none;
}

#pauseBtn{
    position:absolute;
    right:12px;
    top:10px;
    z-index:50;
    margin:0;
    padding:10px 16px;
}

#soundBtn{
    position:absolute;
    right:12px;
    top:65px;
    z-index:50;
    width:45px;
    height:45px;
    margin:0;
    padding:0;
    border-radius:50%;
    background:white;
}


/* DRIVING BUTTONS */

.control{
    position:absolute;
    bottom:20px;

    width:105px;
    height:105px;

    padding:0;
    margin:0;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.45);

    z-index:100;

    font-size:0;

    color:transparent;

    text-indent:-9999px;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;

    -webkit-tap-highlight-color:transparent;

    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

#accelerate{
    right:20px;
    background:#16a34a;
}

#brake{
    left:20px;
    background:#dc2626;
}

.control:active{
    transform:scale(.92);
}


/* PAUSE */

#pauseScreen{
    position:absolute;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.7);
    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

#pauseScreen h1{
    font-size:50px;
}


/* COUNTDOWN */

#countdown{
    position:absolute;
    inset:0;
    z-index:150;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:100px;
    font-weight:900;

    text-shadow:5px 5px #000;

    pointer-events:none;
}


/* OTHER SCREENS */

#mode,
#mapMenu,
#lobby{
    background:#172b18;
    color:white;
    text-align:center;
}

#players{
    width:min(450px,90%);
    margin:20px auto;
    text-align:left;
}

.player{
    background:#333;
    margin:5px 0;
    padding:10px;
    border-radius:8px;
}


@media(max-height:500px){

    .control{
        width:75px;
        height:75px;
        bottom:12px;
    }

    #hud{
        font-size:14px;
        top:7px;
        left:8px;
    }

    #pauseBtn{
        top:7px;
        right:8px;
    }

    #soundBtn{
        top:60px;
        right:8px;
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>


<!-- =====================================================
     MAIN MENU
===================================================== -->

<div id="menu" class="screen">

    <div class="menuBox">

        <div class="logo">
            HILL WARRIORS
        </div>

        <div class="developer">
            Developed by Prabhat Kumar Singh
        </div>

        <input
            id="playerName"
            type="text"
            maxlength="18"
            placeholder="Enter your name"
            autocomplete="off">

        <button
            id="startBtn"
            class="primary"
            type="button">

            START GAME

        </button>

    </div>

</div>


<!-- =====================================================
     MODE
===================================================== -->

<div id="mode" class="screen hidden">

    <div>

        <h1>HILL WARRIORS</h1>

        <h2>Choose Game Mode</h2>

        <button
            id="singleBtn"
            class="primary"
            type="button">

            SINGLE PLAYER

        </button>

        <button
            id="multiBtn"
            class="secondary"
            type="button">

            MULTIPLAYER

        </button>

        <br>

        <button
            id="backBtn"
            class="secondary"
            type="button">

            BACK

        </button>

    </div>

</div>


<!-- =====================================================
     MAP
===================================================== -->

<div id="mapMenu" class="screen hidden">

    <div>

        <h1>SELECT MAP</h1>

        <button
            class="primary mapBtn"
            data-map="jungle"
            type="button">

            🌴 JUNGLE

        </button>

        <button
            class="primary mapBtn"
            data-map="sand"
            type="button">

            🏜️ SAND

        </button>

        <button
            class="primary mapBtn"
            data-map="space"
            type="button">

            🚀 SPACE

        </button>

        <br>

        <button
            id="mapBack"
            class="secondary"
            type="button">

            BACK

        </button>

    </div>

</div>


<!-- =====================================================
     MULTIPLAYER
===================================================== -->

<div id="lobby" class="screen hidden">

    <div>

        <h1>MULTIPLAYER</h1>

        <p>Maximum 4 players</p>

        <input
            id="roomCode"
            placeholder="Enter room code">

        <br>

        <button
            id="createBtn"
            class="primary"
            type="button">

            CREATE ROOM

        </button>

        <button
            id="joinBtn"
            class="secondary"
            type="button">

            JOIN ROOM

        </button>

        <h2 id="roomTitle"></h2>

        <div id="players"></div>

        <button
            id="readyBtn"
            class="primary hidden"
            type="button">

            READY

        </button>

        <br>

        <button
            id="lobbyBack"
            class="secondary"
            type="button">

            MAIN MENU

        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game" class="hidden">

    <canvas id="canvas"></canvas>

    <div id="hud">

        Distance:
        <span id="distance">0</span> m

        <br>

        Position:
        <span id="position">1</span>/4

        <br>

        Fuel:
        <span id="fuel">100</span>%

    </div>


    <button
        id="pauseBtn"
        type="button">

        PAUSE

    </button>


    <button
        id="soundBtn"
        type="button">

        🔊

    </button>


    <!-- GREEN ACCELERATE -->

    <button
        id="accelerate"
        class="control"
        type="button"
        aria-label="Accelerate">
    </button>


    <!-- RED BRAKE -->

    <button
        id="brake"
        class="control"
        type="button"
        aria-label="Brake">
    </button>


    <!-- PAUSE SCREEN -->

    <div
        id="pauseScreen"
        class="hidden">

        <h1>PAUSED</h1>

        <button
            id="resumeBtn"
            class="primary"
            type="button">

            RESUME

        </button>

        <button
            id="menuBtn"
            class="secondary"
            type="button">

            MAIN MENU

        </button>

    </div>


    <div id="countdown"></div>

</div>



<script>

/* =====================================================
   HILL WARRIORS
===================================================== */

"use strict";


/* =====================================================
   HELPER
===================================================== */

function $(id){
    return document.getElementById(id);
}


/* =====================================================
   VARIABLES
===================================================== */

let playerName =
    localStorage.getItem("hillWarriorsName") || "";

let selectedMap =
    "jungle";

let gameMode =
    "single";

let running =
    false;

let paused =
    false;

let accelerate =
    false;

let brake =
    false;

let racers =
    [];

let car =
    null;

let terrain =
    [];

let animationID =
    null;


/* =====================================================
   AUDIO
===================================================== */

let audio =
    null;

let master =
    null;

let engine =
    null;

let engineGain =
    null;

let soundEnabled =
    true;


/*
   Audio is completely optional.
   If Android/WebView doesn't support it,
   the game still works.
*/

function setupAudio(){

    if(audio)
        return;

    try{

        const AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioClass)
            return;

        audio =
            new AudioClass();

        master =
            audio.createGain();

        master.gain.value =
            0.25;

        master.connect(
            audio.destination
        );

    }
    catch(error){

        audio = null;
        master = null;

    }

}


function wakeAudio(){

    setupAudio();

    if(!audio)
        return;

    try{

        if(
            audio.state ===
            "suspended"
        ){

            audio.resume();

        }

    }
    catch(error){}

}


function beep(
    frequency,
    duration
){

    if(!soundEnabled)
        return;

    setupAudio();

    if(!audio || !master)
        return;

    try{

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            0,
            audio.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            0.12,
            audio.currentTime+0.01
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime+duration
        );

        oscillator.connect(gain);

        gain.connect(master);

        oscillator.start();

        oscillator.stop(
            audio.currentTime+
            duration+
            0.03
        );

    }
    catch(error){}

}


/* Engine */

function startEngine(){

    if(!soundEnabled)
        return;

    setupAudio();

    if(!audio || !master)
        return;

    if(engine)
        return;

    try{

        engine =
            audio.createOscillator();

        engineGain =
            audio.createGain();

        engine.type =
            "sawtooth";

        engine.frequency.value =
            80;

        engineGain.gain.value =
            0.02;

        engine.connect(
            engineGain
        );

        engineGain.connect(
            master
        );

        engine.start();

    }
    catch(error){

        engine = null;
        engineGain = null;

    }

}


function updateEngine(){

    if(
        !engine ||
        !engineGain ||
        !audio ||
        !car
    )
        return;

    try{

        if(
            !running ||
            paused ||
            !soundEnabled
        ){

            engineGain.gain.value =
                0;

            return;

        }

        const speed =
            Math.abs(car.vx);

        engine.frequency.value =
            80 + speed*30;

        engineGain.gain.value =
            0.015 +
            Math.min(
                speed*0.006,
                0.04
            );

    }
    catch(error){}

}


function stopEngine(){

    if(engine){

        try{
            engine.stop();
        }
        catch(error){}

    }

    engine = null;
    engineGain = null;

}


/* =====================================================
   SOUND BUTTON
===================================================== */

$("soundBtn").onclick =
function(){

    soundEnabled =
        !soundEnabled;

    $("soundBtn").textContent =
        soundEnabled
        ? "🔊"
        : "🔇";

    if(soundEnabled){

        wakeAudio();

        beep(
            700,
            0.1
        );

        if(running)
            startEngine();

    }

};


/* =====================================================
   SCREEN
===================================================== */

function showScreen(id){

    $("menu").classList.add("hidden");
    $("mode").classList.add("hidden");
    $("mapMenu").classList.add("hidden");
    $("lobby").classList.add("hidden");
    $("game").classList.add("hidden");

    $(id).classList.remove("hidden");

}


/* =====================================================
   START BUTTON
===================================================== */

$("startBtn").onclick =
function(){

    /*
       FIRST change screen.
       This means even if audio has
       a problem, START still works.
    */

    const name =
        $("playerName").value.trim();

    if(!name){

        $("playerName").focus();

        $("playerName").placeholder =
            "Please enter your name";

        return;

    }

    playerName =
        name;

    try{

        localStorage.setItem(
            "hillWarriorsName",
            playerName
        );

    }
    catch(error){}


    showScreen("mode");


    /*
       Audio comes AFTER the
       screen change.
    */

    setTimeout(
        function(){

            wakeAudio();

            beep(
                650,
                0.1
            );

        },
        10
    );

};


/* =====================================================
   MODE
===================================================== */

$("singleBtn").onclick =
function(){

    gameMode =
        "single";

    beep(
        600,
        0.08
    );

    showScreen("mapMenu");

};


$("multiBtn").onclick =
function(){

    gameMode =
        "multi";

    beep(
        600,
        0.08
    );

    showScreen("lobby");

};


$("backBtn").onclick =
function(){

    showScreen("menu");

};


/* =====================================================
   MAP
===================================================== */

const mapButtons =
    document.querySelectorAll(".mapBtn");


mapButtons.forEach(
function(button){

    button.onclick =
    function(){

        selectedMap =
            button.dataset.map;

        beep(
            700,
            0.08
        );

        startSinglePlayer();

    };

});


$("mapBack").onclick =
function(){

    showScreen("mode");

};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    $("canvas");

const ctx =
    canvas.getContext("2d");

let W =
    window.innerWidth;

let H =
    window.innerHeight;


function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W*dpr;

    canvas.height =
        H*dpr;

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


window.onresize =
    resize;

resize();


/* =====================================================
   TERRAIN
===================================================== */

function makeTerrain(){

    terrain = [];

    for(
        let x=0;
        x<12000;
        x+=20
    ){

        let y;

        if(
            selectedMap ===
            "jungle"
        ){

            y =
                H*0.70 +
                Math.sin(x*0.008)*55 +
                Math.sin(x*0.021)*25;

        }
        else if(
            selectedMap ===
            "sand"
        ){

            y =
                H*0.72 +
                Math.sin(x*0.006)*65 +
                Math.sin(x*0.017)*20;

        }
        else{

            y =
                H*0.65 +
                Math.sin(x*0.009)*75 +
                Math.sin(x*0.026)*30;

        }

        terrain.push({
            x:x,
            y:y
        });

    }

}


function groundY(x){

    if(
        terrain.length === 0
    ){

        return H*0.7;

    }

    if(x<=0)
        return terrain[0].y;

    let i =
        Math.floor(x/20);

    if(
        i>=terrain.length-1
    ){

        i =
            terrain.length-2;

    }

    if(i<0)
        i=0;

    const a =
        terrain[i];

    const b =
        terrain[i+1];

    const t =
        (x-a.x)/
        (b.x-a.x);

    return (
        a.y+
        (b.y-a.y)*t
    );

}


/* =====================================================
   CAR
===================================================== */

function newCar(
    x,
    color
){

    return {

        x:x,

        y:
            groundY(x)-35,

        vx:0,

        vy:0,

        angle:0,

        color:color,

        airborne:false

    };

}


/* =====================================================
   SINGLE PLAYER
===================================================== */

function makeSingleRace(){

    racers = [

        newCar(
            100,
            "#2477ff"
        ),

        newCar(
            50,
            "#e53935"
        ),

        newCar(
            0,
            "#20b45a"
        ),

        newCar(
            -50,
            "#ff8c00"
        )

    ];

    car =
        racers[0];

}


function startSinglePlayer(){

    makeTerrain();

    makeSingleRace();

    running =
        true;

    paused =
        false;

    accelerate =
        false;

    brake =
        false;

    $("pauseScreen")
        .classList
        .add("hidden");

    showScreen("game");

    wakeAudio();

    startEngine();

    countdown();

    cancelAnimationFrame(
        animationID
    );

    gameLoop();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function countdown(){

    let n =
        3;

    $("countdown")
        .textContent =
        n;

    beep(
        500,
        0.15
    );


    const timer =
        setInterval(
        function(){

            n--;

            if(n>0){

                $("countdown")
                    .textContent =
                    n;

                beep(
                    500,
                    0.15
                );

            }
            else{

                $("countdown")
                    .textContent =
                    "GO!";

                beep(
                    900,
                    0.3
                );

                setTimeout(
                    function(){

                        $("countdown")
                            .textContent =
